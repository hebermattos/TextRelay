global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend rabbitmq_amqp
    bind *:5672
    default_backend rabbitmq_nodes

backend rabbitmq_nodes
    balance roundrobin
    option tcp-check
    server rabbitmq-1 rabbitmq-1:5672 check inter 3s fall 3 rise 2
    server rabbitmq-2 rabbitmq-2:5672 check inter 3s fall 3 rise 2
    server rabbitmq-3 rabbitmq-3:5672 check inter 3s fall 3 rise 2

frontend rabbitmq_management
    bind *:15672
    default_backend rabbitmq_management_nodes

backend rabbitmq_management_nodes
    balance roundrobin
    option tcp-check
    server rabbitmq-1 rabbitmq-1:15672 check inter 3s fall 3 rise 2
    server rabbitmq-2 rabbitmq-2:15672 check inter 3s fall 3 rise 2
    server rabbitmq-3 rabbitmq-3:15672 check inter 3s fall 3 rise 2

