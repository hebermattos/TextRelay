services:
  rabbitmq-1:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    mem_limit: 384m
    cpus: 0.40
    hostname: rabbitmq-1
    mem_reservation: 256m
    environment: &rabbitmq-environment
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-sms}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-sms}"
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:-text-relay-local-cluster-cookie}"
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
    healthcheck: &rabbitmq-healthcheck
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq-2:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    mem_limit: 384m
    cpus: 0.40
    hostname: rabbitmq-2
    mem_reservation: 256m
    environment: *rabbitmq-environment
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    command: >
      sh -c "rabbitmq-server -detached &&
      until rabbitmqctl await_startup; do sleep 2; done &&
      rabbitmqctl stop_app &&
      rabbitmqctl reset &&
      rabbitmqctl join_cluster rabbit@rabbitmq-1 &&
      rabbitmqctl start_app &&
      tail -f /dev/null"
    healthcheck: *rabbitmq-healthcheck

  rabbitmq-3:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    mem_limit: 384m
    cpus: 0.40
    hostname: rabbitmq-3
    mem_reservation: 256m
    environment: *rabbitmq-environment
    volumes:
      - rabbitmq-3-data:/var/lib/rabbitmq
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    command: >
      sh -c "rabbitmq-server -detached &&
      until rabbitmqctl await_startup; do sleep 2; done &&
      rabbitmqctl stop_app &&
      rabbitmqctl reset &&
      rabbitmqctl join_cluster rabbit@rabbitmq-1 &&
      rabbitmqctl start_app &&
      tail -f /dev/null"
    healthcheck: *rabbitmq-healthcheck

  rabbitmq-lb:
    image: haproxy:3.2-alpine
    mem_limit: 48m
    cpus: 0.20
    mem_reservation: 32m
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      rabbitmq-3:
        condition: service_healthy
    volumes:
      - ./docker/rabbitmq-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports: ["5672:5672", "15672:15672"]
    restart: unless-stopped

  ollama:
    profiles: [ai]
    image: ollama/ollama:0.12.3
    mem_limit: 1024m
    cpus: 0.75
    mem_reservation: 768m
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-init:
    profiles: [ai]
    image: ollama/ollama:0.12.3
    mem_limit: 256m
    cpus: 0.50
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5:0.5b"]

  redis:
    image: redis:7.4-alpine
    mem_limit: 64m
    cpus: 0.20
    mem_reservation: 32m
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickstack:
    image: docker.io/clickhouse/clickstack-local:2.21.0
    mem_limit: 768m
    cpus: 0.75
    mem_reservation: 512m
    ports:
      - "18123:8123"
    volumes:
      - clickstack-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    mem_limit: 128m
    cpus: 0.25
    mem_reservation: 64m
    depends_on:
      clickstack:
        condition: service_healthy
    environment:
      OPAMP_SERVER_URL: ""
      CLICKHOUSE_ENDPOINT: "http://clickstack:8123"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: "default"

  hyperdx-auth:
    image: caddy:2.10-alpine
    mem_limit: 64m
    cpus: 0.25
    mem_reservation: 32m
    depends_on:
      clickstack:
        condition: service_healthy
    environment:
      HYPERDX_USERNAME: "${HYPERDX_USERNAME:-HyperDX}"
      HYPERDX_PASSWORD: "${HYPERDX_PASSWORD:-HyperDX}"
    volumes:
      - ./docker/hyperdx-auth-entrypoint.sh:/usr/local/bin/hyperdx-auth-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/hyperdx-auth-entrypoint.sh"]
    ports: ["8081:8080"]

  backup-init:
    image: alpine:3.22
    mem_limit: 64m
    cpus: 0.25
    user: "0:0"
    volumes:
      - ${POSTGRES_BACKUP_PATH:-./backups}:/backups
    command: ["/bin/sh", "-c", "mkdir -p /backups/base /backups/wal && chown -R 70:70 /backups && chmod -R 770 /backups"]

  postgres:
    image: postgres:17-alpine
    mem_reservation: 128m
    mem_limit: 384m
    cpus: 0.75
    depends_on:
      backup-init:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_timeout=${WAL_ARCHIVE_TIMEOUT_SECONDS:-60}s
      - -c
      - archive_command=test -f /backups/wal/%f || cp %p /backups/wal/%f
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-sms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      POSTGRES_DB: "postgres"
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${POSTGRES_BACKUP_PATH:-./backups}:/backups
      - ./database/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$(printenv POSTGRES_USER)\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-init:
    image: postgres:17-alpine
    mem_limit: 256m
    cpus: 0.50
    mem_reservation: 128m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database:/database:ro
    environment:
      PGHOST: "postgres"
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-sms}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        set -eu
        database_exists() {
          [ "$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$1'")" = "1" ]
        }

        if ! database_exists "sms_api"; then
          createdb sms_api
          psql -v ON_ERROR_STOP=1 -d sms_api -f /database/schema.sql
        fi
        psql -v ON_ERROR_STOP=1 -d sms_api -f /database/refresh-tokens.sql
        psql -v ON_ERROR_STOP=1 -d sms_api -f /database/seeds/example_tenant.sql

        if ! database_exists "sms_api_logs"; then
          createdb sms_api_logs
          psql -v ON_ERROR_STOP=1 -d sms_api_logs -f /database/logs-schema.sql
        fi

        if ! database_exists "sms_api_reporting"; then
          createdb sms_api_reporting
          psql -v ON_ERROR_STOP=1 -d sms_api_reporting -f /database/reporting-schema.sql
        fi

  postgres-backup:
    image: postgres:17-alpine
    mem_limit: 128m
    cpus: 0.25
    mem_reservation: 64m
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./database/backup.sh:/backup.sh:ro
      - ${POSTGRES_BACKUP_PATH:-./backups}:/backups
    environment:
      PGHOST: "postgres"
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-sms}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      PGDATABASE: "postgres"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

  provider-init:
    mem_reservation: 128m
    mem_limit: 256m
    cpus: 0.50
    build:
      context: .
      dockerfile: database/seeds/TextRelay.Seed/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      Admin__Username: "${ADMIN_USERNAME:-platform}"
      Admin__Password: "${ADMIN_PASSWORD:-platform}"
      Admin__Email: "${ADMIN_EMAIL:-platform@example.com}"
      Admin__AllowInsecureBootstrapPassword: "true"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sms_api;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"

  api-1:
    mem_reservation: 128m
    mem_limit: 256m
    cpus: 0.50
    build:
      context: .
      dockerfile: src/TextRelay.Api/Dockerfile
    depends_on:
      provider-init:
        condition: service_completed_successfully
      rabbitmq-lb:
        condition: service_started
      redis:
        condition: service_healthy
      clickstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sms_api;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__LogsPostgres: "Host=postgres;Port=5432;Database=sms_api_logs;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__ReportingPostgres: "Host=postgres;Port=5432;Database=sms_api_reporting;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Enabled: "${CACHE_ENABLED:-true}"
      Jwt__Key: "${JWT_KEY:-local-development-jwt-key-change-me-1234567890}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"
      Sms__PublicBaseUrl: "${SMS_PUBLIC_BASE_URL:-https://localhost:8080}"
      Ollama__BaseUrl: "http://ollama:11434/"
      RabbitMq__Host: "rabbitmq-lb"
      RabbitMq__Port: "5672"
      RabbitMq__ManagementHost: "rabbitmq-lb"
      RabbitMq__ManagementPort: "15672"
      RabbitMq__SendPrefetchCount: "${RABBITMQ_SEND_PREFETCH_COUNT:-4}"
      RabbitMq__SendConcurrentMessageLimit: "${RABBITMQ_SEND_CONCURRENCY:-4}"
      RabbitMq__User: "${RABBITMQ_USER:-sms}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-sms}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "textrelay-api"
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=api-1,deployment.environment=development"

  api-2:
    mem_reservation: 128m
    mem_limit: 256m
    cpus: 0.50
    build:
      context: .
      dockerfile: src/TextRelay.Api/Dockerfile
    depends_on:
      provider-init:
        condition: service_completed_successfully
      rabbitmq-lb:
        condition: service_started
      redis:
        condition: service_healthy
      clickstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sms_api;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__LogsPostgres: "Host=postgres;Port=5432;Database=sms_api_logs;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__ReportingPostgres: "Host=postgres;Port=5432;Database=sms_api_reporting;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Enabled: "${CACHE_ENABLED:-true}"
      Jwt__Key: "${JWT_KEY:-local-development-jwt-key-change-me-1234567890}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"
      Sms__PublicBaseUrl: "${SMS_PUBLIC_BASE_URL:-https://localhost:8080}"
      Ollama__BaseUrl: "http://ollama:11434/"
      RabbitMq__Host: "rabbitmq-lb"
      RabbitMq__Port: "5672"
      RabbitMq__ManagementHost: "rabbitmq-lb"
      RabbitMq__ManagementPort: "15672"
      RabbitMq__SendPrefetchCount: "${RABBITMQ_SEND_PREFETCH_COUNT:-4}"
      RabbitMq__SendConcurrentMessageLimit: "${RABBITMQ_SEND_CONCURRENCY:-4}"
      RabbitMq__User: "${RABBITMQ_USER:-sms}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-sms}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "textrelay-api"
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=api-2,deployment.environment=development"

  haproxy:
    image: haproxy:3.2-alpine
    mem_limit: 48m
    cpus: 0.20
    mem_reservation: 32m
    depends_on:
      api-1:
        condition: service_started
      api-2:
        condition: service_started
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports: ["8080:8080", "127.0.0.1:8404:8404"]
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    mem_reservation: 128m
    mem_limit: 256m
    cpus: 0.50
    build:
      context: .
      dockerfile: src/TextRelay.Worker/Dockerfile
    depends_on:
      provider-init:
        condition: service_completed_successfully
      rabbitmq-lb:
        condition: service_started
      redis:
        condition: service_healthy
      clickstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sms_api;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__LogsPostgres: "Host=postgres;Port=5432;Database=sms_api_logs;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__ReportingPostgres: "Host=postgres;Port=5432;Database=sms_api_reporting;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Enabled: "${CACHE_ENABLED:-true}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"
      Ollama__BaseUrl: "http://ollama:11434/"
      RabbitMq__Host: "rabbitmq-lb"
      RabbitMq__Port: "5672"
      RabbitMq__ManagementHost: "rabbitmq-lb"
      RabbitMq__ManagementPort: "15672"
      RabbitMq__SendPrefetchCount: "${RABBITMQ_SEND_PREFETCH_COUNT:-4}"
      RabbitMq__SendConcurrentMessageLimit: "${RABBITMQ_SEND_CONCURRENCY:-4}"
      RabbitMq__User: "${RABBITMQ_USER:-sms}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-sms}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "textrelay-worker"
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=worker-1,deployment.environment=development"
    restart: unless-stopped

  webhook-tests:
    profiles: [tests]
    mem_limit: 768m
    cpus: 1.00
    mem_reservation: 256m
    build:
      context: .
      dockerfile: tests/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SMS_TEST_POSTGRES: "Host=postgres;Port=5432;Database=sms_api;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-TextRelay_Local_2026!}"

  ui:
    mem_reservation: 32m
    mem_limit: 64m
    cpus: 0.20
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports: ["4200:80"]

volumes:
  rabbitmq-1-data:
  rabbitmq-2-data:
  rabbitmq-3-data:
  postgres-data:
  clickstack-data:
  ollama-data:
